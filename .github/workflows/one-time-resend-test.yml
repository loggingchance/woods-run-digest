name: One-time Woods Run delivery test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/test-trigger.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Send delivery test
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_scheduled_test.py
