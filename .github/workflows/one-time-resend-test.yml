name: One-time Woods Run scheduled delivery test

on:
  workflow_dispatch:
  schedule:
    - cron: '42 18 2 10 *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Date guard
        id: guard
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          print("run=" + ("true" if datetime.now(timezone.utc).date().isoformat()=="2026-10-02" else "false"))
          PY
      - name: Send scheduled test
        if: steps.guard.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_scheduled_test.py
