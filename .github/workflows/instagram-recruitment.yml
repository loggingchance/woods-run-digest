name: WR Instagram recruitment Buffer handoff
on:
  push:
    branches: [main]
    paths: ['data/instagram-recruitment-trigger.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wr-instagram-recruitment
  cancel-in-progress: false
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate isolated campaign safeguards
        run: python scripts/test_instagram_recruitment.py
      - name: Configure receipt author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Instagram-only handoff and provider readback
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/instagram_recruitment.py
