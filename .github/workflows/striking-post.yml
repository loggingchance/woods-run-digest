name: Woods Run striking X post (native Buffer schedule)

on:
  workflow_dispatch:
  schedule:
    # 09:40 Denver in daylight/standard time; the other slot is a no-op.
    - cron: '40 15,16 * * *'
  push:
    branches: [main]
    paths:
      - 'data/striking-trigger.json'

permissions:
  contents: write

concurrency:
  group: woods-run-striking-native
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the standing daily handoff from the verified current edition
        id: request
        if: github.event_name == 'schedule'
        run: python scripts/prepare_striking_request.py
      - name: Persist the refreshed handoff before the provider attempt
        if: github.event_name == 'schedule' && steps.request.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/striking-trigger.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare current daily striking handoff"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Test striking safeguards without publishing
        run: python -m unittest discover -s tests -p test_striking_handoff.py -v
      - name: Validate native striking publisher without publishing
        run: python -m py_compile scripts/striking_queue.py scripts/buffer_queue.py scripts/post_to_buffer.py
      - name: Queue only the current striking observation for 10 AM inside Buffer
        if: github.event_name != 'schedule' || steps.request.outputs.should_run == 'true'
        run: python scripts/striking_queue.py
      - name: Verify the accepted provider ID after Buffer's scheduled time
        if: github.event_name != 'schedule' || steps.request.outputs.should_run == 'true'
        run: python scripts/striking_queue.py --verify
