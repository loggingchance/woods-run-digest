name: Woods Run single publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-publisher.yml'
  schedule:
    # 6:00 / 6:10 / 6:30 Eastern across DST; the local-time guard skips the other UTC set.
    - cron: '0,10,30 10 * * *'
    - cron: '0,10,30 11 * * *'

permissions:
  contents: write

concurrency:
  group: woods-run-single-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Live cutover: this workflow owns production delivery.
      WRD_DELIVERY_MODE: live
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt

      - name: Resolve scheduled local-time slot
        id: slot
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ.get("GITHUB_EVENT_NAME") != "schedule":
              print("run=true")
          else:
              now=datetime.now(ZoneInfo("America/New_York"))
              print("run=" + ("true" if now.hour == 6 and now.minute in (0,10,30) else "false"))
          PY

      - name: Build and validate today's publication
        if: steps.slot.outputs.run == 'true'
        run: python scripts/publish_daily_digest.py build

      - name: Commit generated canonical surfaces and assets
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/index.html sitemap.xml data/publication-status assets/cards assets/videos 20??/??/??/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build Woods Run publication state"
            git push origin HEAD:main
          fi

      - name: Delivery state machine
        if: steps.slot.outputs.run == 'true'
        run: python scripts/publish_daily_digest.py deliver

      - name: Verify publication state
        if: steps.slot.outputs.run == 'true'
        run: python scripts/publish_daily_digest.py verify

      - name: Commit final ledger
        if: steps.slot.outputs.run == 'true'
        run: |
          git add data/publication-status
          if ! git diff --cached --quiet; then
            git commit -m "Record Woods Run publication ledger"
            git push origin HEAD:main
          fi
