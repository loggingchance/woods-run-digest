name: Woods Run native Buffer handoff

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/social-trigger.json'

permissions:
  contents: write

concurrency:
  group: woods-run-social-publisher
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native scheduler syntax and credential
        run: |
          python -m py_compile scripts/buffer_queue.py scripts/post_to_buffer.py
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "::error::BUFFER_API_KEY is missing"
            exit 1
          fi
      - name: Audit or hand off the exact requested run to Buffer
        run: |
          python - <<'PY'
          import json, subprocess, sys
          request = json.load(open('data/social-trigger.json'))
          command = [sys.executable, 'scripts/buffer_queue.py']
          if request.get('verify_only'):
              command.append('--verify')
          raise SystemExit(subprocess.call(command))
          PY
      - name: Preserve exact delivery receipts even when a channel fails
        if: always()
        run: |
          if [ -d data/buffer-delivery ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/buffer-delivery
            if ! git diff --cached --quiet; then
              git commit -m "Record native Buffer handoff and verification receipts"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
