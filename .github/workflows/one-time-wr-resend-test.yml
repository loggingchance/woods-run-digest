name: One-time Woods Run scheduled resend test

on:
  schedule:
    - cron: '34 18 2 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resend-test:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard one-time test date
        id: guard
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc)
          manual=os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch"
          ok=manual or (now.year==2026 and now.month==10 and now.day==2 and now.hour==18 and 33 <= now.minute <= 50)
          print("run=" + ("true" if ok else "false"))
          PY

      - name: Send today's Woods Run issue to Steven
        if: steps.guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          import html as html_lib, json, os, re, time, urllib.request, urllib.error
          from pathlib import Path

          api_key=os.environ["RESEND_API_KEY"]
          issues=json.loads(Path("data/issues.json").read_text(encoding="utf-8"))
          issue=next((x for x in issues if x.get("date")=="2026-10-02"), None)
          if not issue:
              raise SystemExit("October 2 issue metadata missing")
          y,m,d=issue["date"].split("-")
          p=Path(y)/m/d/"index.html"
          if not p.exists():
              raise SystemExit("October 2 canonical page missing")
          page=p.read_text(encoding="utf-8")
          if issue["displayDate"] not in page:
              raise SystemExit("canonical page/date mismatch")

          body = page.split("<main>",1)[1].split("</main>",1)[0] if "<main>" in page else page
          body = re.sub(r"<header[\s\S]*?</header>", "", body, flags=re.I)
          body = body.replace('href="/', 'href="https://woodsrun.forestenterprise.org/')
          html_body=f"""<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="X-UA-Compatible" content="IE=edge"></head><body style="margin:0;background-color:#f2eee5;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f2eee5"><tr><td align="center"><table width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#fffdf8" style="width:100%;max-width:600px;background-color:#fffdf8;"><tr><td style="padding:28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:23px;color:#333333;"><p style="font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:34px;color:#1f3b2b;font-weight:bold;">WOODS RUN DIGEST — SCHEDULED DELIVERY TEST</p><p style="font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:30px;color:#222222;">{issue['displayDate']}</p>{body}</td></tr></table></td></tr></table></body></html>"""
          text=re.sub(r"<script[\s\S]*?</script>","",page,flags=re.I)
          text=re.sub(r"<style[\s\S]*?</style>","",text,flags=re.I)
          text=html_lib.unescape(re.sub(r"<[^>]+>","\n",text))
          text=re.sub(r"\n{3,}","\n\n",text).strip()

          payload={
              "from":"Steve Bick | Woods Run Digest <no_reply@forestenterprise.org>",
              "to":["steve@northeastforests.com"],
              "reply_to":["steve@northeastforests.com"],
              "subject":"TEST — Woods Run Digest — October 2, 2026",
              "html":html_body,
              "text":"SCHEDULED DELIVERY TEST\n\n"+text,
          }
          data=json.dumps(payload).encode()
          req=urllib.request.Request(
              "https://api.resend.com/emails",
              data=data,
              method="POST",
              headers={
                  "Authorization":f"Bearer {api_key}",
                  "Content-Type":"application/json",
                  "Idempotency-Key":"woods-run-scheduled-test/2026-10-02"
              })
          with urllib.request.urlopen(req,timeout=45) as r:
              out=json.load(r)
          email_id=out.get("id")
          if not email_id:
              raise SystemExit(f"send returned no id: {out}")

          deadline=time.time()+180
          last=None
          while time.time()<deadline:
              req=urllib.request.Request(
                  f"https://api.resend.com/emails/{email_id}",
                  headers={"Authorization":f"Bearer {api_key}"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  detail=json.load(r)
              last=detail.get("last_event")
              if last=="delivered":
                  print("DELIVERED_OK",email_id)
                  break
              if last in {"bounced","failed","suppressed","complained"}:
                  raise SystemExit(f"test email ended in {last}")
              time.sleep(5)
          else:
              raise SystemExit(f"test email not delivered in time; last_event={last}")
          PY

      - name: Remove one-time workflow after successful test
        if: success() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-wr-resend-test.yml
          git commit -m "Remove completed Woods Run resend test"
          git pull --rebase origin main
          git push origin HEAD:main
