name: Woods Run early media preparation

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/issues.json'
      - 'data/prepare-trigger.json'

permissions:
  contents: write

concurrency:
  group: woods-run-media-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media preparation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check --only-binary=:all: imageio-ffmpeg==0.6.0
            mkdir -p "$RUNNER_TEMP/woodsrun-bin"
            FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            ln -sf "$FFMPEG" "$RUNNER_TEMP/woodsrun-bin/ffmpeg"
            echo "$RUNNER_TEMP/woodsrun-bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/woodsrun-bin/ffmpeg" -version
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Generate missing current-date assets and check dimensions
        run: |
          python -m py_compile scripts/prepare_daily_assets.py
          python scripts/prepare_daily_assets.py
      - name: Commit media and preparation record only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards assets/videos data/preparation
          if ! git diff --cached --quiet; then
            git commit -m "Prepare current Woods Run card and vertical video"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
