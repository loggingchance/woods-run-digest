name: Woods Run early media preparation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/issues.json'
      - 'data/prepare-trigger.json'

permissions:
  contents: write

concurrency:
  group: woods-run-media-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned preparation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check --only-binary=:all: imageio-ffmpeg==0.6.0
            mkdir -p "$RUNNER_TEMP/woodsrun-bin"
            FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            ln -sf "$FFMPEG" "$RUNNER_TEMP/woodsrun-bin/ffmpeg"
            echo "$RUNNER_TEMP/woodsrun-bin" >> "$GITHUB_PATH"
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Run delivery and email regression tests without credentials
        run: python -m unittest discover -s tests -v
      - name: Mirror and verify the authoritative published Site edition
        run: python scripts/sync_public_editorial.py
      - name: Compile full public edition into email payloads without sending
        run: python scripts/prepare_email_payload.py
      - name: Generate current media and validate dimensions
        run: python scripts/prepare_daily_assets.py
      - name: Persist prepared outputs without any publishing credentials
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in assets/cards assets/videos data/preparation data/email-payloads data/editorial-handoff data/issues.json 20[0-9][0-9] index.html archive/index.html sitemap.xml; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record current Woods Run prepared media and email content"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
