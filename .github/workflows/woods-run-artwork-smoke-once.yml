name: Woods Run artwork dry-run QA (no publishing)

# One-time change-triggered smoke test; not a delivery timer or newsletter writer.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/woods-run-artwork-smoke-once.yml'

permissions:
  contents: read

jobs:
  dry_run:
    name: Verify illustration library and render without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install production renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          command -v ffmpeg
          command -v ffprobe
      - name: Run complete production test suite without credentials
        run: python -m unittest discover -s tests -v
      - name: Render historical dated issue into /tmp only
        run: |
          python scripts/render_daily_reel.py --source-root . --date 2026-10-13 --output /tmp/woodsrun-artwork-dry-run.mp4
          test -s /tmp/woodsrun-artwork-dry-run.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json /tmp/woodsrun-artwork-dry-run.mp4 > /tmp/woodsrun-artwork-ffprobe.json
          cat /tmp/woodsrun-artwork-ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/woodsrun-artwork-ffprobe.json').read_text())
          v=j['streams'][0]
          assert (v['width'], v['height']) == (1080,1920)
          assert v['r_frame_rate'] == '30/1'
          assert abs(float(j['format']['duration'])-41.5)<0.1
          print('ARTWORK_DRY_RUN_PASS: 8 curated assets, full 41.5-second video; no emails or social posts')
          PY
