name: Woods Run artwork dry-run QA (no publishing)

# One-time, change-triggered isolated QA. No provider credentials and no delivery timer.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/woods-run-artwork-smoke-once.yml'

permissions:
  contents: read

jobs:
  dry_run:
    name: Verify illustration library and render without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact preparation dependencies and FFmpeg fallback
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check --only-binary=:all: imageio-ffmpeg==0.6.0
            mkdir -p "$RUNNER_TEMP/woodsrun-bin"
            FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            ln -sf "$FFMPEG" "$RUNNER_TEMP/woodsrun-bin/ffmpeg"
            echo "$RUNNER_TEMP/woodsrun-bin" >> "$GITHUB_PATH"
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Run full preparation regression tests without credentials
        run: python -m unittest discover -s tests -v
      - name: Render existing dated issue only in /tmp and inspect output
        run: |
          python scripts/render_daily_reel.py --source-root . --date 2026-10-13 --output /tmp/woodsrun-artwork-dry-run.mp4
          test -s /tmp/woodsrun-artwork-dry-run.mp4
          python - <<'PY'
          import json, re, shutil, subprocess
          from pathlib import Path
          video=Path('/tmp/woodsrun-artwork-dry-run.mp4')
          manifest=json.loads(video.with_suffix('.json').read_text())
          assert manifest['format']=='approved-v4'
          assert manifest['dimensions']==[1080,1920]
          assert manifest['fps']==30 and abs(manifest['duration_seconds']-41.5)<0.1
          ffmpeg=shutil.which('ffmpeg')
          assert ffmpeg
          info=subprocess.run([ffmpeg,'-i',str(video)],text=True,capture_output=True).stderr
          assert 'Video: h264' in info and '1080x1920' in info, info
          assert re.search(r'Duration: 00:00:41\\.5[0-9]',info), info
          print('ARTWORK_DRY_RUN_PASS: full MP4 rendered; no email or social calls')
          PY
