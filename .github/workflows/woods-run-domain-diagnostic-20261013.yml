name: Woods Run custom domain diagnostic (read only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/woods-run-domain-diagnostic-20261013.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare public production hosts, DNS, and editions without modifications
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,ssl,socket,json,hashlib,datetime,re
          hosts=['woodsrun.forestenterprise.org','woods-run-digest.steve760060.chatgpt.site']
          paths=['/','/archive/','/2026/10/13/','/data/issues.json']
          for host in hosts:
              print('HOST',host, flush=True)
              try:
                  ips=sorted({x[4][0] for x in socket.getaddrinfo(host,443)})
                  print('RESOLVED_IPS',json.dumps(ips), flush=True)
              except Exception as exc:print('DNS_ERROR',repr(exc),flush=True)
              for path in paths:
                  url='https://'+host+path
                  print('PATH',path,flush=True)
                  for follow in (False,True):
                      try:
                          class NoRedirect(urllib.request.HTTPRedirectHandler):
                              def redirect_request(self,req,fp,code,msg,hdrs,newurl):return None
                          opener=urllib.request.build_opener() if follow else urllib.request.build_opener(NoRedirect)
                          req=urllib.request.Request(url,headers={'User-Agent':'WoodsRunDomainDiagnostic/20261013','Cache-Control':'no-cache'})
                          with opener.open(req,timeout=14) as response:
                              body=response.read(2_000_000)
                              txt=body.decode('utf8','replace')
                              title=re.search(r'<title[^>]*>([^<]{0,200})</title>',txt,re.I)
                              result={'url':url,'follow_redirects':follow,'status':response.status,
                                  'final_url':response.url,'content_type':response.headers.get('Content-Type'),
                                  'date':response.headers.get('Date'),'cache_control':response.headers.get('Cache-Control'),
                                  'age':response.headers.get('Age'),
                                  'server':response.headers.get('Server'),
                                  'cf_ray':response.headers.get('CF-Ray'),
                                  'etag':response.headers.get('ETag'),'last_modified':response.headers.get('Last-Modified'),
                                  'bytes_read':len(body),'sha256':hashlib.sha256(body).hexdigest(),
                                  'title':title.group(1) if title else None,
                                  'oct13':txt.find('October 13, 2026'),'oct1':txt.find('October 1, 2026'),
                                  'first_entry_date':(re.search(r'"date"\s*:\s*"(20\d{2}-\d{2}-\d{2})"',txt) or [None,None])[1]}
                              print('RESULT',json.dumps(result),flush=True)
                      except urllib.error.HTTPError as exc:
                          print('HTTP_ERROR',json.dumps({'follow_redirects':follow,'code':exc.code,'location':exc.headers.get('Location'),'reason':str(exc)}),flush=True)
                      except Exception as exc:
                          print('REQUEST_ERROR',json.dumps({'follow_redirects':follow,'error':str(exc)}),flush=True)
          print('DONE_DIAGNOSTIC_NO_WRITES',flush=True)
          PY

      - name: Inspect DNS CNAME/A/AAAA/TXT and authoritative nameservers
        run: |
          python -m pip install --disable-pip-version-check dnspython==2.8.0
          python - <<'PY'
          import dns.resolver,json
          names=['forestenterprise.org','woodsrun.forestenterprise.org','_openai-site-verification.woodsrun.forestenterprise.org','m-hostname.woodsrun.forestenterprise.org']
          providers={'default':None,'cloudflare':'1.1.1.1','google':'8.8.8.8'}
          for provider,ip in providers.items():
              res=dns.resolver.Resolver()
              if ip:res.nameservers=[ip]
              res.lifetime=7;res.timeout=4
              for name in names:
                  for typ in (['NS'] if name=='forestenterprise.org' else ['CNAME','A','AAAA','TXT']):
                      try:
                          ans=res.resolve(name,typ,raise_on_no_answer=False,search=False)
                          lines=[str(v) for v in ans] if ans.rrset else []
                          print('DNS_QUERY '+json.dumps({'provider':provider,'name':name,'type':typ,'answers':lines,'ttl':ans.rrset.ttl if ans.rrset else None}),flush=True)
                      except Exception as e:print('DNS_QUERY '+json.dumps({'provider':provider,'name':name,'type':typ,'error':type(e).__name__+': '+str(e)[:130]}),flush=True)
          PY

      - name: Directly query the GoDaddy authoritative DNS servers
        run: |
          python -m pip install --disable-pip-version-check dnspython==2.8.0
          python - <<'PY'
          import dns.resolver, dns.message, dns.query, dns.rdatatype, dns.flags, json
          names=['woodsrun.forestenterprise.org','_openai-site-verification.woodsrun.forestenterprise.org','m-hostname.woodsrun.forestenterprise.org']
          servers=['ns33.domaincontrol.com','ns34.domaincontrol.com']
          for server in servers:
              rr=dns.resolver.resolve(server,'A')
              ips=[str(a) for a in rr]
              print('AUTHORITATIVE_NS',server,'IPS',ips,flush=True)
              for name in names:
                  for typ in (['CNAME','A','AAAA','TXT'] if name==names[0] else ['TXT']):
                      request=dns.message.make_query(name,typ)
                      request.flags &= ~dns.flags.RD
                      try:
                          reply=dns.query.udp(request,ips[0],timeout=5)
                          parts=[]
                          for answer in reply.answer:
                              parts.extend([str(a) for a in answer])
                          print('AUTH_REPLY '+json.dumps({'nameserver':server,'name':name,'type':typ,'rcode':reply.rcode(),'answers':parts,'authoritative':bool(reply.flags & dns.flags.AA)}),flush=True)
                      except Exception as e:
                          print('AUTH_ERROR '+json.dumps({'nameserver':server,'name':name,'type':typ,'error':str(e)[:300]}),flush=True)
          PY

      - name: Check for accidentally doubled GoDaddy hostnames
        run: |
          python -m pip install --disable-pip-version-check dnspython==2.8.0
          python - <<'PY'
          import dns.message,dns.query,dns.flags,json
          ip='97.74.106.17'
          names=['woodsrun.forestenterprise.org.forestenterprise.org',
             '_openai-site-verification.woodsrun.forestenterprise.org.forestenterprise.org',
             'm-hostname.woodsrun.forestenterprise.org.forestenterprise.org',
             '_openai-site-verification.woodsrun.forestenterprise.org',
             'm-hostname.woodsrun.forestenterprise.org']
          for n in names:
            for t in ['CNAME','TXT']:
              q=dns.message.make_query(n,t)
              q.flags &= ~dns.flags.RD
              try:
                r=dns.query.udp(q,ip,timeout=5)
                ans=[str(rr) for a in r.answer for rr in a]
                print('DUPLICATE_NAME_CHECK '+json.dumps({'name':n,'type':t,'rcode':r.rcode(),'answers':ans}),flush=True)
              except Exception as ex:print('DUPLICATE_NAME_CHECK '+json.dumps({'name':n,'type':t,'error':str(ex)}),flush=True)
          PY
